name: Docker (Coolify)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag da imagem no Docker Hub
        required: true
        default: latest
      skip_quality:
        description: Pular lint/typecheck (rebuild mais rápido em hotfixes)
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-coolify.yml"
      - "Dockerfile"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "src/**"

concurrency:
  group: docker-coolify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: openmonetis
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_quality }}
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit
          pnpm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      # O recurso no Coolify acompanha a tag `latest`. Publicar outra tag
      # (rebuild pontual via workflow_dispatch) não deve promover nada.
      - name: Disparar deploy no Coolify
        if: ${{ env.IMAGE_TAG == 'latest' }}
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${COOLIFY_WEBHOOK:-}" || -z "${COOLIFY_TOKEN:-}" ]]; then
            echo "::notice::COOLIFY_WEBHOOK/COOLIFY_TOKEN ausentes — deploy automático ignorado."
            exit 0
          fi

          # Sem --retry de propósito: repetir o disparo enfileira um segundo
          # deploy do mesmo commit em vez de corrigir a falha.
          status="$(curl --silent --show-error --location \
            --max-time 60 \
            --output /tmp/coolify-deploy.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}" || echo 000)"

          echo "Resposta do Coolify (HTTP ${status}):"
          cat /tmp/coolify-deploy.json || true
          echo ""

          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            echo "::error::Coolify recusou o disparo do deploy (HTTP ${status}). A imagem foi publicada; refaça o deploy pela interface."
            exit 1
          fi

          echo "::notice::Deploy disparado no Coolify."

      - name: Resumo
        if: always()
        run: |
          echo "Imagem publicada: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
